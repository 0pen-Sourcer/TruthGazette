<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="The Truth Gazette">
  <!-- App icon. Dark ground matches the masthead; the page motif sits inside the
       central 60% so Android's maskable crop can round or squircle it without
       cutting anything that matters. -->
  <rect width="512" height="512" fill="#1a1a1a"/>

  <g transform="translate(116,104)">
    <!-- the page -->
    <rect width="280" height="304" rx="6" fill="#f4f1e8"/>
    <!-- folded corner -->
    <path d="M244 0 L280 36 L244 36 Z" fill="#d4c5a9"/>

    <!-- masthead rule -->
    <rect x="28" y="30" width="188" height="14" rx="2" fill="#c41e3a"/>
    <rect x="28" y="58" width="224" height="5" rx="2" fill="#1a1a1a" opacity="0.35"/>

    <!-- columns -->
    <rect x="28" y="88"  width="224" height="9" rx="3" fill="#c41e3a" opacity="0.9"/>
    <rect x="28" y="112" width="176" height="9" rx="3" fill="#c41e3a" opacity="0.75"/>
    <rect x="28" y="136" width="200" height="9" rx="3" fill="#c41e3a" opacity="0.6"/>

    <!-- verdict block -->
    <rect x="28" y="176" width="96" height="72" rx="4" fill="#c41e3a"/>
    <text x="76" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="46"
          font-weight="700" fill="#ffffff" text-anchor="middle">TG</text>

    <!-- remaining copy -->
    <rect x="140" y="176" width="112" height="8" rx="3" fill="#1a1a1a" opacity="0.28"/>
    <rect x="140" y="196" width="112" height="8" rx="3" fill="#1a1a1a" opacity="0.28"/>
    <rect x="140" y="216" width="88"  height="8" rx="3" fill="#1a1a1a" opacity="0.28"/>
    <rect x="140" y="236" width="112" height="8" rx="3" fill="#1a1a1a" opacity="0.28"/>

    <rect x="28" y="272" width="224" height="8" rx="3" fill="#1a1a1a" opacity="0.2"/>
  </g>
</svg>
